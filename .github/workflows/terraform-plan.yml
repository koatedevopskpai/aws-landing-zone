# =============================================================================
# TERRAFORM PLAN — CI with OIDC Keyless Authentication
# =============================================================================
# ARCHITECTURE DECISION: OIDC-based authentication over static AWS credentials:
# 1. No long-lived access keys stored in GitHub Secrets.
# 2. Temporary credentials via OIDC with configurable session duration (1h).
# 3. Auditable — CloudTrail shows which OIDC session performed each action.
# 4. OIDC thumbprint enforces GitHub repository and branch.
#
# SECURITY SAFEGUARD: AWS IAM OIDC provider is configured to trust only
# this repository's specific branch (main). Pull requests from forks must
# be manually approved.

name: "Terraform Plan"

on:
  pull_request:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tfvars'
      - 'modules/**'
      - .github/workflows/terraform-plan.yml

permissions:
  id-token: write
  contents: read
  pull-requests: write
  checks: write

jobs:
  plan:
    name: "Terraform Plan (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubOIDCRole
          aws-region: eu-west-2
          role-session-name: terraform-plan-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x

      - name: Terraform Init
        run: |
          terraform init -backend-config="envs/${{ matrix.environment }}/backend.hcl"
        working-directory: .

      - name: Terraform Validate
        run: terraform validate

      - name: TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - name: Run TFLint
        run: tflint --config .tflint.hcl --format compact

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          config_file: .checkov.yml
          output_format: cli

      - name: Infracost Estimate
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Run Infracost
        run: |
          infracost breakdown --path . \
            --config-file .infracost.yml \
            --format json > infracost.json
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

      - name: Terraform Plan
        run: |
          terraform plan -var-file="envs/${{ matrix.environment }}/terraform.tfvars" \
            -out=tfplan-${{ matrix.environment }}
        working-directory: .

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: tfplan-${{ matrix.environment }}

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('infracost.json', 'utf8');
            const planOutput = fs.readFileSync('tfplan-${{ matrix.environment }}', 'utf8');
            const body = `## Terraform Plan: ${{ matrix.environment }}\n
            **Plan generated for environment: ${{ matrix.environment }}**\n
            <details>\n<summary>Infracost Estimate</summary>\n\n\`\`\`json\n${output.slice(0, 2000)}\n\`\`\`\n</details>\n
            **Next steps:** Review plan and approve via \`terraform-apply.yml\` workflow.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
